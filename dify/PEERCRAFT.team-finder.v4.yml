    - data:
        code: "import json\nimport re\n\n# Spelling variants that should count as the same skill (after normalising).\nALIASES = {\n    \"reactjs\": \"react\",\n    \"nodejs\": \"node\",\n    \"expressjs\": \"express\",\n    \"vuejs\": \"vue\",\n    \"nextjs\": \"next\",\n    \"js\": \"javascript\",\n    \"ts\": \"typescript\",\n    \"html5\": \"html\",\n    \"css3\": \"css\",\n    \"mongo\": \"mongodb\",\n    \"postgres\": \"postgresql\",\n    \"ml\": \"machinelearning\",\n    \"uiux\": \"uiux\",\n}\n\n\ndef _norm(s):\n    # \"Node.js\", \"node js\" and \"NodeJS\" all become \"nodejs\", then alias-folded.\n    key = re.sub(r\"[\\s.\\-_/]+\", \"\", s.strip().lower())\n    return ALIASES.get(key, key)\n\n\n# Field names that must never be passed on to the website.\nBLOCKED_KEY_PARTS = (\"email\", \"e-mail\", \"mail\", \"phone\", \"mobile\", \"whatsapp\",\n                     \"contact\", \"address\")\n\n\ndef _blocked(key):\n    k = str(key).lower()\n    return any(part in k for part in BLOCKED_KEY_PARTS)\n\n\ndef main(required_skills: str, llm_output: str) -> dict:\n    # 1. Parse required skills (display names kept, compared in normalised form)\n    req = [s.strip() for s in re.split(r\"[,\\n]\", required_skills) if s.strip()]\n    req_norm = {_norm(s): s for s in req}\n\n    # 1b. The first step answers NONE when the text is not a project idea\n    if len(req) == 1 and req[0].strip().upper() == \"NONE\":\n        return {\"result\": json.dumps({\n            \"status\": \"needs_project_description\",\n            \"required_skills\": [],\n            \"total_matches\": 0,\n            \"matches\": [],\n            \"missing_skills\": [],\n        })}\n\n    # 2. Strip markdown fences if the LLM added them\n    raw = llm_output.strip()\n    raw = re.sub(r\"^```(?:json)?\", \"\", raw).strip()\n    raw = re.sub(r\"```$\", \"\", raw).strip()\n\n    # 3. Parse the LLM JSON. A parse failure is an ERROR, never \"no matches\".\n    try:\n        data = json.loads(raw)\n        matches = data.get(\"matches\", [])\n        if not isinstance(matches, list):\n            raise ValueError(\"matches is not a list\")\n        matches = [m for m in matches if isinstance(m, dict)]\n    except Exception:\n        return {\"result\": json.dumps({\n            \"status\": \"error\",\n            \"error\": \"Match step returned invalid JSON\",\n            \"required_skills\": req,\n            \"total_matches\": 0,\n            \"matches\": [],\n            \"missing_skills\": req,\n        })}\n\n    # 3b. Remove contact fields, at the top level and inside other_details\n    for m in matches:\n        for key in [k for k in m if _blocked(k)]:\n            del m[key]\n        od = m.get(\"other_details\")\n        if isinstance(od, dict):\n            od = {k: v for k, v in od.items() if not _blocked(k)}\n            if od:\n                m[\"other_details\"] = od\n            else:\n                m.pop(\"other_details\", None)\n        elif \"other_details\" in m:\n            m.pop(\"other_details\", None)\n\n    # 4. Deterministic scoring\n    for m in matches:\n        matched = {_norm(s) for s in m.get(\"matched_skills\", []) if isinstance(s, str)}\n        overlap = matched & set(req_norm)\n        m[\"match_score\"] = round(len(overlap) / max(len(req_norm), 1) * 100, 1)\n        m[\"matched_skill_count\"] = len(overlap)\n\n    # 5. Sort by score, tie-break by matched count, keep the top 5\n    matches.sort(key=lambda x: (x[\"match_score\"], x[\"matched_skill_count\"]), reverse=True)\n    matches = matches[:5]\n\n    # 6. Skills that none of the returned candidates cover\n    covered = set()\n    for m in matches:\n        covered |= {_norm(s) for s in m.get(\"matched_skills\", []) if isinstance(s, str)}\n    missing = [req_norm[k] for k in req_norm if k not in covered]\n\n    # 7. Final envelope\n    return {\"result\": json.dumps({\n        \"status\": \"ok\" if matches else \"no_matches\",\n        \"required_skills\": req,\n        \"total_matches\": len(matches),\n        \"matches\": matches,\n        \"missing_skills\": missing,\n    }, indent=2)}\n"
